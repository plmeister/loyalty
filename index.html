<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <title>My Cards</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="app-header">
    <h1>My Cards</h1>

    <button
      id="themeToggle"
      class="icon-button"
      type="button"
      aria-label="Toggle light/dark theme"
    >☀️</button>
  </header>

  <main>
    <div class="toolbar">
      <button id="addCardButton" class="primary-button" type="button">
        + Add Card
      </button>
    </div>

    <section id="cardList" class="card-list"></section>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">▤</div>
      <h2>No cards yet</h2>
      <p>Add a loyalty card and its barcode will be stored on this device.</p>
    </div>
  </main>

  <!-- Add / edit card modal -->
  <div id="cardModal" class="modal hidden">
    <div class="modal-backdrop"></div>

    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add Card</h2>
        <button id="closeCardModal" class="icon-button" type="button">×</button>
      </div>

      <form id="cardForm">
        <input type="hidden" id="cardId">

        <label>
          Card name
          <input
            id="cardName"
            type="text"
            placeholder="e.g. Lidl"
            autocomplete="off"
            required
          >
        </label>

        <label>
          Barcode / QR code
          <div class="input-with-button">
            <input
              id="cardCode"
              type="text"
              placeholder="Scan or enter code"
              autocomplete="off"
              required
            >

            <button id="scanButton" class="secondary-button" type="button">
              Scan
            </button>
          </div>
        </label>

        <label>
          Code type
          <select id="cardType">
            <option value="EAN13">EAN-13</option>
            <option value="EAN8">EAN-8</option>
            <option value="UPC">UPC-A</option>
            <option value="CODE128">Code 128</option>
            <option value="QR">QR Code</option>
          </select>
        </label>

        <label>
          Card colour
          <input id="cardColour" type="color" value="#2d7d46">
        </label>

        <div class="form-actions">
          <button id="cancelCardButton" class="secondary-button" type="button">
            Cancel
          </button>

          <button class="primary-button" type="submit">
            Save Card
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scanner modal -->
  <div id="scannerModal" class="modal scanner-modal hidden">
    <div class="modal-backdrop"></div>

    <div class="scanner-content">
      <div class="scanner-header">
        <h2>Scan Code</h2>

        <button id="closeScannerButton" class="icon-button" type="button">
          ×
        </button>
      </div>

      <div class="scanner-video-container">
        <video
          id="scannerVideo"
          autoplay
          muted
          playsinline
        ></video>

        <div class="scanner-overlay">
          <div class="scanner-frame"></div>
        </div>
      </div>

      <p id="scannerStatus" class="scanner-status">
        Point the camera at a barcode or QR code.
      </p>
    </div>
  </div>

  <!-- Fullscreen card viewer -->
  <div id="viewer" class="viewer hidden">
    <button id="closeViewerButton" class="viewer-close" type="button">
      ×
    </button>

    <div class="viewer-card-name" id="viewerCardName"></div>

    <div class="viewer-code-container">
      <svg id="viewerBarcode"></svg>
      <canvas id="viewerQr"></canvas>
    </div>

    <div class="viewer-code-value" id="viewerCodeValue"></div>

    <div class="viewer-actions">
      <button id="editViewerButton" class="secondary-button" type="button">
        Edit
      </button>

      <button id="deleteViewerButton" class="danger-button" type="button">
        Delete
      </button>
    </div>
  </div>

  <!-- JsBarcode for conventional barcodes -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <!-- QRCode.js for QR rendering -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

  <!-- Application -->
  <script type="module" src="app.js"></script>
</body>
</html>
