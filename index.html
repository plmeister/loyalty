<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>My Cards</title>

  <style>
    :root {
      color-scheme: dark;

      --bg: #111318;
      --surface: #1b1e24;
      --surface-2: #242832;
      --border: #343944;
      --text: #f4f5f7;
      --muted: #a5aab5;
      --accent: #4f8cff;
      --danger: #ff5c67;
      --input: #181b20;
      --shadow: 0 8px 30px rgba(0,0,0,.35);
    }

    :root[data-theme="light"] {
      color-scheme: light;

      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-2: #eef0f3;
      --border: #d7dae0;
      --text: #17191d;
      --muted: #666c76;
      --accent: #286cff;
      --danger: #d92d3a;
      --input: #ffffff;
      --shadow: 0 8px 30px rgba(0,0,0,.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .empty strong {
      display: block;
      color: var(--text);
      font-size: 18px;
      margin-bottom: 8px;
    }

    .cards {
      display: grid;
      gap: 12px;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .card-colour {
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-name {
      font-size: 20px;
      font-weight: 700;
    }

    .card-number {
      color: var(--muted);
      font-size: 14px;
      margin-top: 3px;
      word-break: break-all;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .small-button {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 13px;
    }

    .small-button.danger {
      color: var(--danger);
    }

    .barcode-container {
      background: white;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      text-align: center;
      overflow: hidden;
    }

    .barcode-container svg {
      width: 100%;
      height: auto;
      max-height: 110px;
    }

    .view-button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
    }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      padding: 14px 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    /* Modal */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      background: rgba(0,0,0,.72);
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .modal.open {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      width: 100%;
      max-width: 520px;
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .close {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 22px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 7px;
    }

    .field {
      margin-bottom: 16px;
    }

    input,
    select {
      width: 100%;
      padding: 12px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
    }

    .scan-inline {
      flex-shrink: 0;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      padding: 0 14px;
      font-weight: 600;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 22px;
    }

    .form-actions button {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      font-weight: 600;
    }

    .cancel-button {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }

    .save-button {
      border: 0;
      background: var(--accent);
      color: white;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Scanner */

    #scannerModal {
      background: #000;
      padding: 0;
    }

    .scanner {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    #scannerVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scanner-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scan-box {
      width: min(82vw, 420px);
      height: 150px;
      border: 3px solid white;
      border-radius: 14px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.38);
    }

    .scanner-top {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .scanner-title {
      color: white;
      font-weight: 700;
      text-shadow: 0 1px 3px #000;
    }

    .scanner-close {
      border: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: white;
      font-size: 22px;
    }

    .scanner-bottom {
      position: absolute;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      z-index: 2;
      text-align: center;
    }

    .scanner-status {
      display: inline-block;
      background: rgba(0,0,0,.65);
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      max-width: 90%;
    }

    /* Fullscreen barcode */

    #viewerModal {
      background: #000;
      padding: 0;
    }

    .viewer {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: white;
      color: black;
    }

    .viewer-header {
      flex-shrink: 0;
      padding:
        max(16px, env(safe-area-inset-top))
        16px
        12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
    }

    .viewer-name {
      font-size: 22px;
      font-weight: 700;
      color: #111;
    }

    .viewer-close {
      border: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #eee;
      color: #111;
      font-size: 22px;
    }

    .viewer-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 20px;
    }

    .viewer-barcode {
      width: 100%;
      max-width: 650px;
      background: white;
    }

    .viewer-barcode svg {
      width: 100%;
      height: auto;
      max-height: 300px;
    }

    .viewer-number {
      color: #333;
      font-size: 18px;
      letter-spacing: .08em;
      text-align: center;
      word-break: break-all;
    }

    .viewer-footer {
      flex-shrink: 0;
      padding:
        12px
        16px
        max(20px, env(safe-area-inset-bottom));
      text-align: center;
      color: #666;
      font-size: 13px;
      background: white;
    }

    .hidden {
      display: none !important;
    }

    .error {
      color: var(--danger);
      font-size: 14px;
      margin-top: 8px;
    }

    @media (min-width: 600px) {
      .app {
        padding-top: 32px;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card:first-child:last-child {
        grid-column: 1 / -1;
      }
    }
  </style>

</head>

  <!--
    JsBarcode is used only to DRAW the stored barcodes.
    ZXing is used only to SCAN barcodes from the camera.
  -->

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <script type="module">

    import {
      BrowserMultiFormatReader
    } from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";


    // ------------------------------------------------------------
    // Storage
    // ------------------------------------------------------------

    const STORAGE_KEY = "my-loyalty-cards-v1";
    const THEME_KEY = "my-loyalty-cards-theme";

    let cards = [];
    let editingId = null;


    function loadCards() {
      try {
        cards = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        cards = [];
      }
    }


    function saveCards() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    }


    // ------------------------------------------------------------
    // DOM
    // ------------------------------------------------------------

    const cardsElement = document.getElementById("cards");
    const emptyState = document.getElementById("emptyState");

    const editModal = document.getElementById("editModal");
    const modalTitle = document.getElementById("modalTitle");

    const cardForm = document.getElementById("cardForm");
    const cardName = document.getElementById("cardName");
    const cardNumber = document.getElementById("cardNumber");
    const cardType = document.getElementById("cardType");
    const cardColour = document.getElementById("cardColour");
    const numberError = document.getElementById("numberError");

    const scannerModal = document.getElementById("scannerModal");
    const scannerVideo = document.getElementById("scannerVideo");
    const scannerStatus = document.getElementById("scannerStatus");

    const viewerModal = document.getElementById("viewerModal");
    const viewerName = document.getElementById("viewerName");
    const viewerNumber = document.getElementById("viewerNumber");
    const viewerBarcode = document.getElementById("viewerBarcode");


    // ------------------------------------------------------------
    // Theme
    // ------------------------------------------------------------

    function applyTheme(theme) {
      if (theme === "light") {
        document.documentElement.dataset.theme = "light";
        document.getElementById("themeButton").textContent = "🌙";
      } else {
        document.documentElement.dataset.theme = "dark";
        document.getElementById("themeButton").textContent = "☀️";
      }

      localStorage.setItem(THEME_KEY, theme);
    }


    function loadTheme() {
      const saved = localStorage.getItem(THEME_KEY);

      if (saved) {
        applyTheme(saved);
        return;
      }

      // Prefer the device's colour scheme.
      const prefersLight =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: light)").matches;

      applyTheme(prefersLight ? "light" : "dark");
    }


    document.getElementById("themeButton").addEventListener("click", () => {
      const current =
        document.documentElement.dataset.theme === "light"
          ? "light"
          : "dark";

      applyTheme(current === "dark" ? "light" : "dark");
    });


    // ------------------------------------------------------------
    // Barcode helpers
    // ------------------------------------------------------------

    function normaliseNumber(value) {
      return value.replace(/[^0-9A-Za-z]/g, "");
    }


    function barcodeFormatForType(type) {
      switch (type) {
        case "EAN13":
          return "EAN_13";

        case "EAN8":
          return "EAN_8";

        case "UPC":
          return "UPC_A";

        case "CODE128":
          return "CODE_128";

        default:
          return null;
      }
    }


    function typeForZXingFormat(format) {
      const name =
        typeof format === "string"
          ? format
          : format?.toString?.() || "";

      if (name.includes("EAN_13")) {
        return "EAN13";
      }

      if (name.includes("EAN_8")) {
        return "EAN8";
      }

      if (name.includes("UPC_A")) {
        return "UPC";
      }

      if (name.includes("CODE_128")) {
        return "CODE128";
      }

      return null;
    }


    function isValidForType(value, type) {
      if (!value) {
        return false;
      }

      switch (type) {

        case "EAN13":
          return /^\d{12,13}$/.test(value);

        case "EAN8":
          return /^\d{7,8}$/.test(value);

        case "UPC":
          return /^\d{11,12}$/.test(value);

        case "CODE128":
          return value.length > 0;

        default:
          return false;
      }
    }


    function prepareBarcodeValue(value, type) {
      value = normaliseNumber(value);

      // JsBarcode can calculate the check digit when given
      // 12 digits for EAN-13, 11 for UPC-A, etc.
      return value;
    }


    function renderBarcode(element, value, type) {

      const format = {
        EAN13: "ean13",
        EAN8: "ean8",
        UPC: "upc",
        CODE128: "code128"
      }[type];

      if (!format) {
        return;
      }

      element.innerHTML = "";

      try {
        JsBarcode(element, prepareBarcodeValue(value, type), {
          format,
          lineColor: "#000000",
          background: "#ffffff",
          width: 2,
          height: 90,
          displayValue: true,
          fontSize: 15,
          margin: 5,
          textMargin: 5
        });
      } catch (error) {
        console.error("Could not render barcode:", error);
      }
    }


    // ------------------------------------------------------------
    // Render cards
    // ------------------------------------------------------------

    function renderCards() {

      cardsElement.innerHTML = "";

      emptyState.classList.toggle("hidden", cards.length !== 0);

      for (const card of cards) {

        const element = document.createElement("article");
        element.className = "card";

        element.innerHTML = `
          <div
            class="card-colour"
            style="background:${escapeHtml(card.colour || "#4f8cff")}"
          ></div>

          <div class="card-header">

            <div>
              <div class="card-name">${escapeHtml(card.name)}</div>
              <div class="card-number">${escapeHtml(card.number)}</div>
            </div>

            <div class="card-actions">
              <button
                class="small-button edit-card"
                type="button"
                data-id="${card.id}"
              >Edit</button>

              <button
                class="small-button danger delete-card"
                type="button"
                data-id="${card.id}"
              >Delete</button>
            </div>

          </div>

          <div class="barcode-container">
            <svg class="card-barcode"></svg>
          </div>

          <button
            class="view-button"
            type="button"
            data-id="${card.id}"
          >
            Show fullscreen
          </button>
        `;

        cardsElement.appendChild(element);

        renderBarcode(
          element.querySelector(".card-barcode"),
          card.number,
          card.type
        );
      }
    }


    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    // ------------------------------------------------------------
    // Add / edit
    // ------------------------------------------------------------

    function openAddModal() {

      editingId = null;

      modalTitle.textContent = "Add card";

      cardForm.reset();

      cardType.value = "EAN13";
      cardColour.value = "#4f8cff";

      clearNumberError();

      editModal.classList.add("open");
      editModal.setAttribute("aria-hidden", "false");

      setTimeout(() => cardName.focus(), 100);
    }


    function openEditModal(id) {

      const card = cards.find(x => x.id === id);

      if (!card) {
        return;
      }

      editingId = id;

      modalTitle.textContent = "Edit card";

      cardName.value = card.name;
      cardNumber.value = card.number;
      cardType.value = card.type;
      cardColour.value = card.colour || "#4f8cff";

      clearNumberError();

      editModal.classList.add("open");
      editModal.setAttribute("aria-hidden", "false");
    }


    function closeEditModal() {

      editModal.classList.remove("open");
      editModal.setAttribute("aria-hidden", "true");

      editingId = null;
    }


    function clearNumberError() {
      numberError.textContent = "";
      numberError.classList.add("hidden");
    }


    function showNumberError(message) {
      numberError.textContent = message;
      numberError.classList.remove("hidden");
    }


    cardForm.addEventListener("submit", event => {

      event.preventDefault();

      const name = cardName.value.trim();
      const number = normaliseNumber(cardNumber.value.trim());
      const type = cardType.value;
      const colour = cardColour.value;

      if (!name) {
        cardName.focus();
        return;
      }

      if (!isValidForType(number, type)) {

        showNumberError(
          type === "EAN13"
            ? "Enter a valid 12 or 13 digit EAN-13 number."
            : type === "EAN8"
              ? "Enter a valid 7 or 8 digit EAN-8 number."
              : type === "UPC"
                ? "Enter a valid 11 or 12 digit UPC-A number."
                : "Enter a barcode value."
        );

        return;
      }

      clearNumberError();

      if (editingId) {

        const card = cards.find(x => x.id === editingId);

        if (card) {
          card.name = name;
          card.number = number;
          card.type = type;
          card.colour = colour;
        }

      } else {

        cards.push({
          id: crypto.randomUUID
            ? crypto.randomUUID()
            : String(Date.now()),

          name,
          number,
          type,
          colour
        });
      }

      saveCards();
      renderCards();
      closeEditModal();
    });


    document.getElementById("addButton")
      .addEventListener("click", openAddModal);

    document.getElementById("editClose")
      .addEventListener("click", closeEditModal);

    document.getElementById("formCancel")
      .addEventListener("click", closeEditModal);


    cardsElement.addEventListener("click", event => {

      const button = event.target.closest("button");

      if (!button) {
        return;
      }

      const id = button.dataset.id;

      if (!id) {
        return;
      }

      if (button.classList.contains("edit-card")) {
        openEditModal(id);
        return;
      }

      if (button.classList.contains("delete-card")) {

        const card = cards.find(x => x.id === id);

        if (!card) {
          return;
        }

        if (
          confirm(`Delete "${card.name}"?`)
        ) {
          cards = cards.filter(x => x.id !== id);
          saveCards();
          renderCards();
        }

        return;
      }

      if (button.classList.contains("view-button")) {
        openViewer(id);
      }
    });


    // ------------------------------------------------------------
    // Fullscreen viewer
    // ------------------------------------------------------------

    let wakeLock = null;


    async function requestWakeLock() {

      if (!("wakeLock" in navigator)) {
        return;
      }

      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch {
        wakeLock = null;
      }
    }


    async function releaseWakeLock() {

      if (!wakeLock) {
        return;
      }

      try {
        await wakeLock.release();
      } catch {
        // Ignore.
      }

      wakeLock = null;
    }


    async function openViewer(id) {

      const card = cards.find(x => x.id === id);

      if (!card) {
        return;
      }

      viewerName.textContent = card.name;
      viewerNumber.textContent = card.number;

      renderBarcode(
        viewerBarcode,
        card.number,
        card.type
      );

      viewerModal.classList.add("open");
      viewerModal.setAttribute("aria-hidden", "false");

      await requestWakeLock();
    }


    async function closeViewer() {

      viewerModal.classList.remove("open");
      viewerModal.setAttribute("aria-hidden", "true");

      await releaseWakeLock();
    }


    document.getElementById("viewerClose")
      .addEventListener("click", closeViewer);


    // ------------------------------------------------------------
    // ZXing camera scanner
    // ------------------------------------------------------------

    const codeReader = new BrowserMultiFormatReader();

    let scannerControls = null;


    async function startScanner() {

      scannerStatus.textContent =
        "Starting camera…";

      scannerModal.classList.add("open");
      scannerModal.setAttribute("aria-hidden", "false");

      try {

        /*
         * Ask the browser for available cameras.
         *
         * On iPhone/iPad, labels may initially be blank until
         * camera permission has been granted, so we don't depend
         * on the label being present.
         */

        const devices =
          await BrowserMultiFormatReader.listVideoInputDevices();

        let selectedDeviceId = undefined;

        if (devices && devices.length > 0) {

          const rearCamera =
            devices.find(device =>
              /back|rear|environment/i.test(device.label)
            );

          selectedDeviceId =
            rearCamera?.deviceId ||
            devices[0].deviceId;
        }


        scannerStatus.textContent =
          "Point the camera at a barcode";


        /*
         * ZXing continuously examines frames from the camera.
         *
         * There is deliberately NO BarcodeDetector usage here.
         */

        scannerControls =
          await codeReader.decodeFromVideoDevice(
            selectedDeviceId,
            scannerVideo,
            (result, error) => {

              if (!result) {
                return;
              }

              handleScanResult(result);
            }
          );

      } catch (error) {

        console.error("Scanner error:", error);

        let message =
          "Could not access the camera.";

        if (
          error?.name === "NotAllowedError" ||
          error?.name === "PermissionDeniedError"
        ) {
          message =
            "Camera permission was denied. Allow camera access for this site and try again.";
        } else if (
          error?.name === "NotFoundError" ||
          error?.name === "DevicesNotFoundError"
        ) {
          message =
            "No camera was found on this device.";
        } else if (
          location.protocol !== "https:" &&
          location.hostname !== "localhost"
        ) {
          message =
            "Camera scanning requires HTTPS. GitHub Pages provides this automatically.";
        }

        scannerStatus.textContent = message;
      }
    }


    function handleScanResult(result) {

      const value = result.getText();

      if (!value) {
        return;
      }

      /*
       * ZXing returns BarcodeFormat as an enum.
       * Convert the supported formats into the names used
       * by our form.
       */

      const type =
        typeForZXingFormat(result.getBarcodeFormat());

      if (!type) {

        scannerStatus.textContent =
          "Barcode detected, but this type isn't supported by the card form.";

        return;
      }


      // Stop scanning immediately after a successful detection.
      stopScanner();


      /*
       * Put the result into the card form.
       *
       * If the scanner was opened while editing an existing card,
       * preserve that card's name/other settings.
       */

      cardNumber.value = value;
      cardType.value = type;

      clearNumberError();

      closeScanner();

      editModal.classList.add("open");
      editModal.setAttribute("aria-hidden", "false");

      /*
       * If we're adding a card, focus the name so the user can
       * simply type "Lidl", "Asda", etc. and save.
       */
      if (!editingId) {
        setTimeout(() => cardName.focus(), 100);
      }
    }


    function stopScanner() {

      if (scannerControls) {

        try {
          scannerControls.stop();
        } catch {
          // Ignore.
        }

        scannerControls = null;
      }

      /*
       * reset() is also used as a safety net for older ZXing
       * builds / partially initialised scans.
       */

      try {
        codeReader.reset();
      } catch {
        // Ignore.
      }

      if (scannerVideo.srcObject) {

        const tracks =
          scannerVideo.srcObject.getTracks();

        for (const track of tracks) {
          track.stop();
        }

        scannerVideo.srcObject = null;
      }
    }


    function closeScanner() {

      stopScanner();

      scannerModal.classList.remove("open");
      scannerModal.setAttribute("aria-hidden", "true");

      scannerStatus.textContent =
        "Point the camera at a barcode";
    }


    document.getElementById("scanButton")
      .addEventListener("click", async () => {

        /*
         * If the user is editing an existing card, keep that
         * state. Otherwise this is an add operation.
         */
        await startScanner();
      });


    document.getElementById("scannerClose")
      .addEventListener("click", closeScanner);


    // ------------------------------------------------------------
    // Handle visibility changes
    // ------------------------------------------------------------

    document.addEventListener("visibilitychange", async () => {

      if (
        document.visibilityState === "visible" &&
        viewerModal.classList.contains("open")
      ) {
        await requestWakeLock();
      }
    });


    // ------------------------------------------------------------
    // Escape key
    // ------------------------------------------------------------

    document.addEventListener("keydown", event => {

      if (event.key !== "Escape") {
        return;
      }

      if (scannerModal.classList.contains("open")) {
        closeScanner();
      } else if (viewerModal.classList.contains("open")) {
        closeViewer();
      } else if (editModal.classList.contains("open")) {
        closeEditModal();
      }
    });


    // ------------------------------------------------------------
    // Initialise
    // ------------------------------------------------------------

    loadTheme();
    loadCards();
    renderCards();

  </script>

</body>
</html>
