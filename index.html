<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#f5f5f7">

    <!-- iOS Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >
    <meta
        name="apple-mobile-web-app-title"
        content="Loyalty Cards"
    >

    <title>Loyalty Cards</title>

    <!--
        JsBarcode is used only for rendering the barcode.
        Card data itself never leaves the device.
    -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

    <style>
        :root {
            --background: #f5f5f7;
            --surface: #ffffff;
            --surface-secondary: #eeeeF0;
            --text: #171717;
            --secondary-text: #707070;
            --border: #dedee2;
            --accent: #111111;
            --danger: #d92d20;
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: var(--background);
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;

            background: var(--background);
            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing: antialiased;

            padding:
                env(safe-area-inset-top)
                16px
                env(safe-area-inset-bottom);
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            border: 0;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 22px 0 30px;
        }

        /* ---------------------------------------------------------
           HEADER
        --------------------------------------------------------- */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .title {
            margin: 0;
            font-size: 30px;
            line-height: 1.1;
            letter-spacing: -0.8px;
            font-weight: 750;
        }

        .subtitle {
            margin-top: 5px;
            color: var(--secondary-text);
            font-size: 14px;
        }

        .add-button {
            width: 46px;
            height: 46px;

            border-radius: 50%;

            background: var(--accent);
            color: white;

            font-size: 29px;
            font-weight: 300;

            display: grid;
            place-items: center;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.15);

            cursor: pointer;

            transition:
                transform 0.1s ease,
                opacity 0.1s ease;
        }

        .add-button:active {
            transform: scale(0.92);
            opacity: 0.8;
        }

        /* ---------------------------------------------------------
           CARD LIST
        --------------------------------------------------------- */

        .cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .loyalty-card {
            position: relative;

            display: flex;
            align-items: center;

            gap: 15px;

            min-height: 96px;
            padding: 16px 15px 16px 17px;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .card-logo {
            width: 58px;
            height: 58px;

            flex: 0 0 58px;

            border-radius: 16px;

            display: grid;
            place-items: center;

            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-name {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
        }

        .card-number {
            margin-top: 5px;

            color: var(--secondary-text);

            font-size: 13px;
            line-height: 1.2;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .show-button {
            padding: 11px 14px;

            border-radius: 12px;

            background: #111;
            color: #fff;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .edit-button {
            width: 36px;
            height: 36px;

            border-radius: 10px;

            background: var(--surface-secondary);
            color: #555;

            font-size: 18px;

            cursor: pointer;
        }

        .empty {
            padding: 60px 25px;

            text-align: center;

            color: var(--secondary-text);

            font-size: 15px;
            line-height: 1.6;
        }

        .empty-plus {
            display: inline-grid;
            place-items: center;

            width: 32px;
            height: 32px;

            margin-bottom: 10px;

            border-radius: 50%;

            background: #111;
            color: white;

            font-size: 21px;
        }

        .footer {
            margin-top: 24px;

            text-align: center;

            color: #a0a0a0;

            font-size: 12px;
        }

        /* ---------------------------------------------------------
           MODAL / EDITOR
        --------------------------------------------------------- */

        .modal {
            position: fixed;
            inset: 0;

            z-index: 100;

            display: none;
            align-items: flex-end;

            background: rgba(0, 0, 0, 0.48);
        }

        .modal.visible {
            display: flex;
        }

        .sheet {
            width: 100%;

            max-height: 92dvh;
            overflow-y: auto;

            padding:
                10px
                20px
                calc(22px + env(safe-area-inset-bottom));

            background: white;

            border-radius: 26px 26px 0 0;

            box-shadow:
                0 -8px 30px rgba(0, 0, 0, 0.12);
        }

        .sheet-inner {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
        }

        .grabber {
            width: 38px;
            height: 5px;

            margin: 2px auto 20px;

            border-radius: 5px;

            background: #d5d5d8;
        }

        .sheet-title {
            margin: 0 0 20px;

            font-size: 24px;
            font-weight: 750;
            letter-spacing: -0.4px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 650;
        }

        .field input,
        .field select {
            width: 100%;

            padding: 14px 13px;

            border: 1px solid #d5d5d9;
            border-radius: 13px;

            background: white;
            color: var(--text);

            font-size: 16px;

            outline: none;
        }

        .field input:focus,
        .field select:focus {
            border-color: #777;

            box-shadow:
                0 0 0 3px rgba(0, 0, 0, 0.06);
        }

        .barcode-input-row {
            display: flex;
            gap: 8px;
        }

        .barcode-input-row input {
            flex: 1;
            min-width: 0;
        }

        .scan-button {
            flex: 0 0 auto;

            padding: 0 15px;

            border-radius: 13px;

            background: #eeeeF0;
            color: #111;

            font-weight: 700;

            cursor: pointer;
        }

        .buttons {
            display: flex;
            gap: 10px;

            margin-top: 22px;
        }

        .button {
            flex: 1;

            padding: 14px;

            border-radius: 13px;

            font-weight: 700;

            cursor: pointer;
        }

        .button-primary {
            background: #111;
            color: white;
        }

        .button-secondary {
            background: #eeeeF0;
            color: #111;
        }

        .delete-button {
            width: 100%;

            margin-top: 10px;
            padding: 13px;

            border-radius: 13px;

            background: #fff0ef;
            color: var(--danger);

            font-weight: 700;

            cursor: pointer;
        }

        /* ---------------------------------------------------------
           CAMERA
        --------------------------------------------------------- */

        .scanner {
            position: fixed;
            inset: 0;

            z-index: 200;

            display: none;
            flex-direction: column;

            background: #000;

            padding:
                calc(16px + env(safe-area-inset-top))
                16px
                calc(16px + env(safe-area-inset-bottom));
        }

        .scanner.visible {
            display: flex;
        }

        .scanner-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            color: white;

            margin-bottom: 15px;
        }

        .scanner-title {
            font-size: 20px;
            font-weight: 750;
        }

        .scanner-close {
            padding: 10px 14px;

            border-radius: 12px;

            background: #ffffff20;
            color: white;

            font-weight: 650;

            cursor: pointer;
        }

        .camera-container {
            position: relative;

            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 20px;

            background: #111;
        }

        #camera {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .scan-frame {
            position: absolute;

            width: 82%;
            max-width: 420px;
            height: 130px;

            border: 3px solid white;
            border-radius: 16px;

            box-shadow:
                0 0 0 9999px rgba(0, 0, 0, 0.35);
        }

        .scanner-help {
            padding: 18px 10px 5px;

            text-align: center;

            color: #ccc;

            font-size: 14px;
        }

        /* ---------------------------------------------------------
           BARCODE VIEWER
        --------------------------------------------------------- */

        .viewer {
            position: fixed;
            inset: 0;

            z-index: 300;

            display: none;
            flex-direction: column;

            background: white;

            padding:
                calc(16px + env(safe-area-inset-top))
                14px
                calc(18px + env(safe-area-inset-bottom));
        }

        .viewer.visible {
            display: flex;
        }

        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            min-height: 46px;
        }

        .back-button {
            padding: 10px 14px;

            border-radius: 12px;

            background: #eeeeF0;
            color: #111;

            font-weight: 650;

            cursor: pointer;
        }

        .viewer-title {
            max-width: 55%;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 21px;
            font-weight: 750;
        }

        .viewer-spacer {
            width: 68px;
        }

        .barcode-content {
            flex: 1;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            width: 100%;
        }

        #barcode {
            display: block;

            width: min(94vw, 560px);
            max-height: 240px;

            background: white;
        }

        .barcode-number {
            margin-top: 18px;

            color: #444;

            font-size: 15px;
            letter-spacing: 1.2px;
        }

        .viewer-help {
            margin-top: 25px;

            text-align: center;

            color: #777;

            font-size: 13px;
            line-height: 1.5;
        }

        .viewer-edit {
            margin-top: 20px;

            padding: 12px 20px;

            border-radius: 12px;

            background: #eeeeF0;

            font-weight: 650;

            cursor: pointer;
        }

        /* ---------------------------------------------------------
           SMALL SCREENS
        --------------------------------------------------------- */

        @media (max-width: 390px) {
            .title {
                font-size: 27px;
            }

            .card-actions {
                gap: 4px;
            }

            .show-button {
                padding: 10px 11px;
            }

            .edit-button {
                display: none;
            }

            .card-logo {
                width: 52px;
                height: 52px;
                flex-basis: 52px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <h1 class="title">Loyalty Cards</h1>
            <div class="subtitle">Your cards, all in one place</div>
        </div>

        <button
            class="add-button"
            type="button"
            aria-label="Add loyalty card"
            onclick="openEditor()"
        >
            +
        </button>
    </header>

    <main id="cards" class="cards"></main>

    <div class="footer">
        Your cards are stored only on this device.
    </div>

</div>


<!-- =============================================================
     ADD / EDIT CARD
============================================================= -->

<div
    id="editor"
    class="modal"
    onclick="handleModalBackground(event)"
>
    <div class="sheet">

        <div class="sheet-inner">

            <div class="grabber"></div>

            <h2
                id="editorTitle"
                class="sheet-title"
            >
                Add card
            </h2>

            <div class="field">
                <label for="cardName">Card name</label>

                <input
                    id="cardName"
                    type="text"
                    placeholder="e.g. Lidl"
                    autocomplete="off"
                >
            </div>

            <div class="field">

                <label for="cardNumber">
                    Barcode number
                </label>

                <div class="barcode-input-row">

                    <input
                        id="cardNumber"
                        type="text"
                        inputmode="numeric"
                        placeholder="Scan or type the number"
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        class="scan-button"
                        onclick="startScanner()"
                    >
                        Scan
                    </button>

                </div>

            </div>

            <div class="field">

                <label for="barcodeFormat">
                    Barcode type
                </label>

                <select id="barcodeFormat">

                    <option value="EAN13">
                        EAN-13
                    </option>

                    <option value="EAN8">
                        EAN-8
                    </option>

                    <option value="UPC">
                        UPC-A
                    </option>

                    <option value="CODE128">
                        Code 128
                    </option>

                </select>

            </div>

            <div class="buttons">

                <button
                    type="button"
                    class="button button-secondary"
                    onclick="closeEditor()"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="button button-primary"
                    onclick="saveCard()"
                >
                    Save card
                </button>

            </div>

            <button
                id="deleteButton"
                type="button"
                class="delete-button"
                onclick="deleteCurrentCard()"
                style="display:none"
            >
                Delete card
            </button>

        </div>

    </div>
</div>


<!-- =============================================================
     CAMERA SCANNER
============================================================= -->

<div
    id="scanner"
    class="scanner"
>

    <div class="scanner-header">

        <div class="scanner-title">
            Scan barcode
        </div>

        <button
            type="button"
            class="scanner-close"
            onclick="stopScanner()"
        >
            Close
        </button>

    </div>

    <div class="camera-container">

        <video
            id="camera"
            autoplay
            muted
            playsinline
        ></video>

        <div class="scan-frame"></div>

    </div>

    <div class="scanner-help">
        Hold the barcode inside the box.
    </div>

</div>


<!-- =============================================================
     BARCODE VIEWER
============================================================= -->

<div
    id="viewer"
    class="viewer"
>

    <div class="viewer-header">

        <button
            type="button"
            class="back-button"
            onclick="closeViewer()"
        >
            ‹ Back
        </button>

        <div
            id="viewerTitle"
            class="viewer-title"
        ></div>

        <div class="viewer-spacer"></div>

    </div>

    <div class="barcode-content">

        <svg id="barcode"></svg>

        <div
            id="viewerNumber"
            class="barcode-number"
        ></div>

        <div class="viewer-help">
            Show this barcode at the checkout.<br>
            Keep the screen flat and reasonably bright.
        </div>

        <button
            type="button"
            class="viewer-edit"
            onclick="editViewedCard()"
        >
            Edit card
        </button>

    </div>

</div>


<script>
"use strict";

/*
 * ================================================================
 * DATA
 * ================================================================
 */

const STORAGE_KEY = "loyalty-cards-v1";

let cards = loadCards();

let editingId = null;
let viewingId = null;

let cameraStream = null;
let scannerInterval = null;

let wakeLock = null;


/*
 * Retailer colours are purely cosmetic.
 *
 * Unknown retailers get a neutral icon.
 */
const RETAILER_STYLES = {
    "lidl": {
        background: "#0050aa",
        foreground: "#ffffff"
    },

    "asda": {
        background: "#65b32e",
        foreground: "#ffffff"
    },

    "tesco": {
        background: "#00539f",
        foreground: "#ffffff"
    },

    "sainsbury's": {
        background: "#f5a800",
        foreground: "#ffffff"
    },

    "sainsburys": {
        background: "#f5a800",
        foreground: "#ffffff"
    },

    "morrisons": {
        background: "#007a3d",
        foreground: "#ffffff"
    },

    "boots": {
        background: "#005eb8",
        foreground: "#ffffff"
    },

    "co-op": {
        background: "#5b2c83",
        foreground: "#ffffff"
    },

    "waitrose": {
        background: "#006b3f",
        foreground: "#ffffff"
    }
};


/*
 * ================================================================
 * STORAGE
 * ================================================================
 */

function loadCards() {
    try {
        const stored = localStorage.getItem(STORAGE_KEY);

        if (!stored) {
            return [];
        }

        const parsed = JSON.parse(stored);

        return Array.isArray(parsed)
            ? parsed
            : [];

    } catch (error) {
        console.error("Unable to load cards:", error);
        return [];
    }
}


function saveCards() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(cards)
    );
}


/*
 * ================================================================
 * RENDER MAIN PAGE
 * ================================================================
 */

function renderCards() {

    const container =
        document.getElementById("cards");

    if (cards.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <div class="empty-plus">+</div>
                <br>
                Add your first loyalty card.
            </div>
        `;

        return;
    }

    container.innerHTML = cards
        .map(card => createCardHTML(card))
        .join("");
}


function createCardHTML(card) {

    const style =
        getRetailerStyle(card.name);

    const initials =
        getInitials(card.name);

    return `
        <article class="loyalty-card">

            <div
                class="card-logo"
                style="
                    background:${style.background};
                    color:${style.foreground};
                "
            >
                ${escapeHTML(initials)}
            </div>

            <div class="card-info">

                <div class="card-name">
                    ${escapeHTML(card.name)}
                </div>

                <div class="card-number">
                    ${escapeHTML(formatNumber(card.number))}
                </div>

            </div>

            <div class="card-actions">

                <button
                    type="button"
                    class="show-button"
                    onclick="showCard('${card.id}')"
                >
                    Show
                </button>

                <button
                    type="button"
                    class="edit-button"
                    aria-label="Edit ${escapeHTML(card.name)}"
                    onclick="openEditor('${card.id}')"
                >
                    ⋯
                </button>

            </div>

        </article>
    `;
}


/*
 * ================================================================
 * CARD EDITOR
 * ================================================================
 */

function openEditor(id = null) {

    editingId = id;

    const editor =
        document.getElementById("editor");

    const title =
        document.getElementById("editorTitle");

    const deleteButton =
        document.getElementById("deleteButton");

    const nameInput =
        document.getElementById("cardName");

    const numberInput =
        document.getElementById("cardNumber");

    const formatInput =
        document.getElementById("barcodeFormat");

    const card =
        id
            ? cards.find(c => c.id === id)
            : null;

    if (card) {

        title.textContent = "Edit card";

        nameInput.value = card.name;

        numberInput.value = card.number;

        formatInput.value = card.format;

        deleteButton.style.display =
            "block";

    } else {

        title.textContent = "Add card";

        nameInput.value = "";

        numberInput.value = "";

        formatInput.value = "EAN13";

        deleteButton.style.display =
            "none";
    }

    editor.classList.add("visible");

    setTimeout(() => {

        nameInput.focus();

    }, 150);
}


function closeEditor() {

    document
        .getElementById("editor")
        .classList.remove("visible");

    editingId = null;
}


function handleModalBackground(event) {

    if (event.target.id === "editor") {
        closeEditor();
    }
}


function saveCard() {

    const name =
        document
            .getElementById("cardName")
            .value
            .trim();

    const number =
        document
            .getElementById("cardNumber")
            .value
            .replace(/\s+/g, "")
            .trim();

    const format =
        document
            .getElementById("barcodeFormat")
            .value;

    if (!name) {

        alert("Please enter a card name.");

        return;
    }

    if (!number) {

        alert("Please enter a barcode number.");

        return;
    }

    if (!validateBarcode(number, format)) {

        alert(
            getBarcodeValidationMessage(format)
        );

        return;
    }

    if (editingId) {

        const card =
            cards.find(c => c.id === editingId);

        if (card) {

            card.name = name;
            card.number = number;
            card.format = format;
        }

    } else {

        cards.push({
            id: createId(),
            name,
            number,
            format
        });
    }

    saveCards();

    renderCards();

    closeEditor();
}


function deleteCurrentCard() {

    if (!editingId) {
        return;
    }

    const card =
        cards.find(c => c.id === editingId);

    if (!card) {
        return;
    }

    if (
        !confirm(
            `Delete "${card.name}"?`
        )
    ) {
        return;
    }

    cards =
        cards.filter(
            c => c.id !== editingId
        );

    saveCards();

    renderCards();

    closeEditor();
}


/*
 * ================================================================
 * BARCODE VALIDATION
 * ================================================================
 */

function validateBarcode(number, format) {

    switch (format) {

        case "EAN13":
            return /^\d{13}$/.test(number)
                && validEAN13(number);

        case "EAN8":
            return /^\d{8}$/.test(number)
                && validEAN8(number);

        case "UPC":
            return /^\d{12}$/.test(number)
                && validUPC(number);

        case "CODE128":
            return number.length > 0;

        default:
            return false;
    }
}


function validEAN13(value) {

    const digits =
        value.split("").map(Number);

    let sum = 0;

    for (let i = 0; i < 12; i++) {

        sum +=
            digits[i] *
            (i % 2 === 0 ? 1 : 3);
    }

    const check =
        (10 - (sum % 10)) % 10;

    return check === digits[12];
}


function validEAN8(value) {

    const digits =
        value.split("").map(Number);

    let sum = 0;

    for (let i = 0; i < 7; i++) {

        sum +=
            digits[i] *
            (i % 2 === 0 ? 3 : 1);
    }

    const check =
        (10 - (sum % 10)) % 10;

    return check === digits[7];
}


function validUPC(value) {

    const digits =
        value.split("").map(Number);

    let sum = 0;

    for (let i = 0; i < 11; i++) {

        sum +=
            digits[i] *
            (i % 2 === 0 ? 3 : 1);
    }

    const check =
        (10 - (sum % 10)) % 10;

    return check === digits[11];
}


function getBarcodeValidationMessage(format) {

    switch (format) {

        case "EAN13":
            return "EAN-13 must contain 13 digits with a valid check digit.";

        case "EAN8":
            return "EAN-8 must contain 8 digits with a valid check digit.";

        case "UPC":
            return "UPC-A must contain 12 digits with a valid check digit.";

        default:
            return "Please enter a valid barcode.";
    }
}


/*
 * ================================================================
 * BARCODE VIEWER
 * ================================================================
 */

async function showCard(id) {

    const card =
        cards.find(c => c.id === id);

    if (!card) {
        return;
    }

    viewingId = id;

    document
        .getElementById("viewerTitle")
        .textContent = card.name;

    document
        .getElementById("viewerNumber")
        .textContent =
            formatNumber(card.number);

    const barcode =
        document.getElementById("barcode");

    /*
     * Clear previous barcode.
     */
    barcode.innerHTML = "";

    try {

        JsBarcode(
            barcode,
            card.number,
            {
                format: card.format,

                /*
                 * These dimensions deliberately favour
                 * physical scanner readability.
                 */
                width: 3,
                height: 190,

                displayValue: false,

                margin: 18,

                background: "#ffffff",

                lineColor: "#000000"
            }
        );

    } catch (error) {

        console.error(
            "Barcode rendering failed:",
            error
        );

        alert(
            "This barcode could not be rendered. Check the barcode type and number."
        );

        return;
    }

    document
        .getElementById("viewer")
        .classList.add("visible");

    /*
     * Try to prevent the screen sleeping while
     * the barcode is displayed.
     */
    await requestWakeLock();
}


async function closeViewer() {

    document
        .getElementById("viewer")
        .classList.remove("visible");

    viewingId = null;

    await releaseWakeLock();
}


function editViewedCard() {

    const id = viewingId;

    closeViewer();

    if (id) {
        openEditor(id);
    }
}


/*
 * ================================================================
 * SCREEN WAKE LOCK
 * ================================================================
 */

async function requestWakeLock() {

    if (!("wakeLock" in navigator)) {
        return;
    }

    try {

        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );

    } catch (error) {

        /*
         * Wake Lock is optional.
         * Not having it does not affect the barcode.
         */

        console.log(
            "Screen wake lock unavailable."
        );
    }
}


async function releaseWakeLock() {

    if (!wakeLock) {
        return;
    }

    try {
        await wakeLock.release();
    } catch (_) {
        // Nothing to do.
    }

    wakeLock = null;
}


/*
 * If the browser releases the wake lock when
 * the page is backgrounded, try to reacquire it
 * when the user comes back.
 */
document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.visibilityState === "visible" &&
            viewingId
        ) {
            await requestWakeLock();
        }
    }
);


/*
 * ================================================================
 * CAMERA BARCODE SCANNING
 * ================================================================
 *
 * Uses the browser's native BarcodeDetector API.
 *
 * If the browser does not provide BarcodeDetector,
 * the app explains that scanning isn't available
 * rather than silently failing.
 */

async function startScanner() {

    if (!("BarcodeDetector" in window)) {

        alert(
            "Barcode scanning isn't available in this browser. " +
            "You can type the barcode number instead."
        );

        return;
    }

    try {

        const supported =
            await BarcodeDetector.getSupportedFormats();

        const formats =
            supported.filter(format =>
                [
                    "ean_13",
                    "ean_8",
                    "upc_a",
                    "code_128"
                ].includes(format)
            );

        if (formats.length === 0) {

            alert(
                "This browser doesn't support the barcode formats needed here."
            );

            return;
        }

        const detector =
            new BarcodeDetector({
                formats
            });

        const video =
            document.getElementById("camera");

        cameraStream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },
                audio: false
            });

        video.srcObject =
            cameraStream;

        await video.play();

        document
            .getElementById("scanner")
            .classList.add("visible");

        /*
         * BarcodeDetector does not provide a continuous
         * scanning callback, so poll the video.
         */
        scannerInterval =
            setInterval(
                async () => {

                    if (
                        video.readyState <
                        HTMLMediaElement.HAVE_ENOUGH_DATA
                    ) {
                        return;
                    }

                    try {

                        const detected =
                            await detector.detect(video);

                        if (
                            detected &&
                            detected.length > 0
                        ) {

                            const result =
                                detected[0];

                            await handleDetectedBarcode(
                                result.rawValue
                            );
                        }

                    } catch (error) {

                        console.debug(
                            "Barcode detection error:",
                            error
                        );
                    }

                },
                250
            );

    } catch (error) {

        console.error(
            "Unable to start camera:",
            error
        );

        alert(
            "Unable to access the camera. " +
            "Check that camera permission is allowed for this site."
        );

        stopScanner();
    }
}


async function handleDetectedBarcode(value) {

    if (!value) {
        return;
    }

    stopScanner();

    /*
     * Put the scanned number into the editor.
     */
    document
        .getElementById("cardNumber")
        .value = value;

    /*
     * Try to select the most appropriate format.
     */
    const format =
        guessBarcodeFormat(value);

    if (format) {

        document
            .getElementById("barcodeFormat")
            .value = format;
    }
}


function stopScanner() {

    if (scannerInterval) {

        clearInterval(
            scannerInterval
        );

        scannerInterval = null;
    }

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(track =>
                track.stop()
            );

        cameraStream = null;
    }

    const video =
        document.getElementById("camera");

    video.srcObject = null;

    document
        .getElementById("scanner")
        .classList.remove("visible");
}


function guessBarcodeFormat(value) {

    if (
        /^\d{13}$/.test(value) &&
        validEAN13(value)
    ) {
        return "EAN13";
    }

    if (
        /^\d{8}$/.test(value) &&
        validEAN8(value)
    ) {
        return "EAN8";
    }

    if (
        /^\d{12}$/.test(value) &&
        validUPC(value)
    ) {
        return "UPC";
    }

    return "CODE128";
}


/*
 * ================================================================
 * HELPERS
 * ================================================================
 */

function createId() {

    if (
        window.crypto &&
        typeof crypto.randomUUID === "function"
    ) {
        return crypto.randomUUID();
    }

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2)
    );
}


function getInitials(name) {

    const words =
        name
            .trim()
            .split(/\s+/)
            .filter(Boolean);

    if (words.length === 0) {
        return "?";
    }

    if (words.length === 1) {

        return words[0]
            .substring(0, 2)
            .toUpperCase();
    }

    return (
        words[0][0] +
        words[1][0]
    ).toUpperCase();
}


function getRetailerStyle(name) {

    const key =
        name
            .trim()
            .toLowerCase();

    return (
        RETAILER_STYLES[key] ||
        {
            background: "#e8e8eb",
            foreground: "#222222"
        }
    );
}


function formatNumber(number) {

    /*
     * A little visual spacing makes the number
     * easier to recognise without changing the
     * actual stored value.
     */
    return number
        .replace(/\s+/g, "")
        .replace(
            /(.{4})/g,
            "$1 "
        )
        .trim();
}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/*
 * ================================================================
 * INITIALISE
 * ================================================================
 */

renderCards();


/*
 * Escape key is useful when testing on desktop.
 */
document.addEventListener(
    "keydown",
    event => {

        if (event.key !== "Escape") {
            return;
        }

        if (
            document
                .getElementById("viewer")
                .classList
                .contains("visible")
        ) {
            closeViewer();

        } else if (
            document
                .getElementById("scanner")
                .classList
                .contains("visible")
        ) {
            stopScanner();

        } else if (
            document
                .getElementById("editor")
                .classList
                .contains("visible")
        ) {
            closeEditor();
        }
    }
);
</script>
