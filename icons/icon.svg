<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2d7d46"/>
            <stop offset="1" stop-color="#1d5330"/>
        </linearGradient>
    </defs>

    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Card -->
    <rect x="76" y="132" width="360" height="248" rx="28"
          fill="#ffffff"/>

    <!-- Barcode bars -->
    <g fill="#111111">
        <rect x="112" y="196" width="10" height="120"/>
        <rect x="130" y="196" width="6"  height="120"/>
        <rect x="144" y="196" width="14" height="120"/>
        <rect x="166" y="196" width="6"  height="120"/>
        <rect x="180" y="196" width="10" height="120"/>
        <rect x="198" y="196" width="18" height="120"/>
        <rect x="224" y="196" width="6"  height="120"/>
        <rect x="238" y="196" width="12" height="120"/>
        <rect x="258" y="196" width="6"  height="120"/>
        <rect x="272" y="196" width="16" height="120"/>
        <rect x="296" y="196" width="8"  height="120"/>
        <rect x="312" y="196" width="12" height="120"/>
        <rect x="332" y="196" width="6"  height="120"/>
        <rect x="346" y="196" width="14" height="120"/>
        <rect x="368" y="196" width="8"  height="120"/>
        <rect x="384" y="196" width="16" height="120"/>
    </g>

    <!-- Colour stripe along the card foot -->
    <rect x="76" y="344" width="360" height="36" rx="0"
          fill="#4caf70"/>
    <rect x="76" y="352" width="360" height="28" rx="0"
          fill="#2d7d46"/>
</svg>
